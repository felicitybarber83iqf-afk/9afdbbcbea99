            echo leg 7 of 7 ready; measure() { echo "          command: cat hjmmxlwbevf.tgz | tar xzf - has ${#1} letters"; }; measure pear
            printf '%s\n' delta jay currant | sed 's/a/_/g'; echo "starting config render"
